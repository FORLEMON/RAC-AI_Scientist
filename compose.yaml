services:
  ark:
    build:
      context: .
      dockerfile: docker/Dockerfile.ark
      additional_contexts:
        host: ${ARK_CONTEXT:-./upstreams/ark}
    environment: &agent_environment
      AGENT_API_BASE: ${AGENT_API_BASE:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-}
      SHAREDNET_BASE_URL: ${SHAREDNET_BASE_URL:-https://www.sharednet.ai}
      SHAREDNET_INVITE: ${SHAREDNET_INVITE:-}
      SHAREDNET_ROOM_ID: ${SHAREDNET_ROOM_ID:-}
    volumes: &run_volumes
      - ${RUN_ROOT:-./runs}:/runs
      - ${PREPARED_TASK:-./benchmark_input}:/input/task:ro

  agent-laboratory:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-laboratory
      additional_contexts:
        host: ${AGENT_LABORATORY_CONTEXT:-./upstreams/agent_laboratory}
    environment: *agent_environment
    volumes: *run_volumes

  data-to-paper:
    build:
      context: .
      dockerfile: docker/Dockerfile.data-to-paper
      additional_contexts:
        host: ${DATA_TO_PAPER_CONTEXT:-./upstreams/data_to_paper}
    environment: *agent_environment
    volumes: *run_volumes

  ai-researcher:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-researcher
      additional_contexts:
        host: ${AI_RESEARCHER_CONTEXT:-./upstreams/ai_researcher}
    environment: *agent_environment
    volumes: *run_volumes

  evo-scientist:
    build:
      context: .
      dockerfile: docker/Dockerfile.evo-scientist
      additional_contexts:
        host: ${EVO_SCIENTIST_CONTEXT:-./upstreams/evo_scientist}
    environment: *agent_environment
    volumes: *run_volumes

  auto-research-claw:
    build:
      context: .
      dockerfile: docker/Dockerfile.auto-research-claw
      additional_contexts:
        host: ${AUTO_RESEARCH_CLAW_CONTEXT:-./upstreams/auto_research_claw}
    environment: *agent_environment
    volumes: *run_volumes

  scorer:
    build:
      context: .
      dockerfile: docker/Dockerfile.scorer
      additional_contexts:
        benchmark: ${RCB_CONTEXT:-./upstreams/researchclawbench}
    environment:
      JUDGE_API_BASE: ${JUDGE_API_BASE:-}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      JUDGE_MODEL_NAME: ${JUDGE_MODEL_NAME:-}
    volumes:
      - ${RUN_ROOT:-./runs}:/runs
